# The website (https://stardraft-editor.github.io) is managed in stardraft-editor/stardraft-editor.github.io. Its
# roadmap comes from docs/project/ROADMAP.md here: a push that changes ROADMAP.md runs that repository's build.py with it
# and pushes the new index.html there. SITE_DEPLOY_KEY: the private half of a write deploy key of that repository only.
name: Roadmap

on:
  push:
    branches: [master]
    paths: [docs/project/ROADMAP.md, .github/workflows/roadmap.yml]
  workflow_dispatch:

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the website with this ROADMAP.md and push it
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site_key
          chmod 600 ~/.ssh/site_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:stardraft-editor/stardraft-editor.github.io.git site
          python site/build.py --roadmap docs/project/ROADMAP.md
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "The page is up to date."
          else
            git commit -m "Page from the roadmap (stardraft@${GITHUB_SHA::7})"
            git push origin HEAD:master
          fi
