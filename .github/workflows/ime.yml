# Korean typed with each system's own input method (IME) into stardraft-next (research/ports/PLAN.md, phase 4: the
# main risk of the new shell). On GitHub's machines only: each takes the focus and sends keys, as a person would.
# The keys are the Korean 2-set layout's: "gksrnrdj" makes 한국어 (ㅎㅏㄴ ㄱㅜㄱ ㅇㅓ), the space commits.
# Then: the Hanja of 한 (the Hanja key, the first candidate), 한/영 (English letters, then Hangul again: "abc 국"),
# and Chinese with Pinyin ("zhongwen" makes 中文).
# Each job keeps what stardraft-next printed (every composition and text event) and its snapshot.
name: IME

on:
  push:
    branches: ['port/next']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the build tools, a virtual display and ibus with Hangul
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config mesa-vulkan-drivers libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev libdbus-1-dev libudev-dev \
            libibus-1.0-dev xvfb xdotool ibus ibus-hangul ibus-libpinyin dbus-x11 dconf-cli dconf-service

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: ime-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target stardraft_next --parallel

      - name: Type Korean with ibus-hangul
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1400x900x24 &
          sleep 2
          eval "$(dbus-launch --sh-syntax)"
          # ibus-hangul starts in English letters unless told: Hangul from the start (before ibus starts)
          dconf write /org/freedesktop/ibus/engine/hangul/initial-input-mode "'hangul'" || true
          dconf read /org/freedesktop/ibus/engine/hangul/initial-input-mode || true
          ibus-daemon -drx
          sleep 3
          ibus engine hangul
          ibus engine
          export SDL_VIDEODRIVER=x11 SDL_IM_MODULE=ibus XMODIFIERS=@im=ibus
          for mode in system inline; do
            flag="--ime-inline"; [ "$mode" = system ] && flag="--ime-system"
            build/stardraft-next --workspace triggers $flag --live 20 --snapshot ime-linux-$mode.png > ime-linux-$mode.txt 2>&1 &
            pid=$!
            for i in $(seq 1 60); do grep -q "^ready" ime-linux-$mode.txt && break; sleep 0.5; done
            ibus engine hangul
            sleep 1
            for k in g k s r n r d j; do xdotool key --delay 120 $k; done
            xdotool key --delay 200 space
            wait $pid || true
            cat ime-linux-$mode.txt
          done
          grep -q "search field: 한국어" ime-linux-system.txt
          grep -q "search field: 한국어" ime-linux-inline.txt
          grep -q '^composing: "하"' ime-linux-inline.txt

          # Hanja (F9 in ibus-hangul, 1 picks the first), 한/영 (Shift+Space), then Chinese with ibus-libpinyin.
          live() {  # live <name> <engine> <keys...>
            name=$1 engine=$2; shift 2
            build/stardraft-next --workspace triggers --live 25 --snapshot ime-linux-$name.png > ime-linux-$name.txt 2>&1 &
            pid=$!
            for i in $(seq 1 60); do grep -q "^ready" ime-linux-$name.txt && break; sleep 0.5; done
            ibus engine $engine || echo "no ibus engine $engine"
            sleep 1
            for k in "$@"; do xdotool key --delay 150 "$k"; done
            wait $pid || true
            cat ime-linux-$name.txt
          }
          live hanja hangul g k s F9 1 space shift+space a b c space shift+space r n r space
          ibus list-engine | grep -iE "pinyin|hangul" || true
          live pinyin libpinyin z h o n g w e n space
          python3 tools/ci/ime_check.py hanja ime-linux-hanja.txt && python3 tools/ci/ime_check.py pinyin ime-linux-pinyin.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ime-linux-${{ github.sha }}
          path: ime-linux-*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: ime-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Build
        run: |
          cmake -S . -B build -A x64
          cmake --build build --config Release --target stardraft_next --parallel

      - name: Add the Korean keyboard (Microsoft IME)
        shell: pwsh
        run: |
          $l = Get-WinUserLanguageList
          $l.Add("ko-KR")
          $l.Add("zh-CN")
          Set-WinUserLanguageList $l -Force
          Get-WinUserLanguageList | Format-List LanguageTag, InputMethodTips

      - name: Type Korean with the Microsoft Korean IME
        shell: pwsh
        run: |
          $failed = 0
          foreach ($mode in @("system", "inline")) {
            $a = @("--workspace", "triggers", "--live", "20", "--snapshot", "ime-windows-$mode.png")
            $a += $(if ($mode -eq "inline") { "--ime-inline" } else { "--ime-system" })
            $p = Start-Process build/Release/stardraft-next.exe -ArgumentList $a -RedirectStandardOutput "ime-windows-$mode.txt" -PassThru
            for ($i = 0; $i -lt 60 -and -not (Select-String -Path "ime-windows-$mode.txt" -Pattern "^ready" -Quiet -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
            pwsh -File tools/ci/ime_keys_windows.ps1 -ProcessId $p.Id -Keys "{layout:00000412}{hangul}gksrnrdj "
            $p.WaitForExit(60000) | Out-Null
            Get-Content "ime-windows-$mode.txt" -Encoding utf8
            if (-not (Select-String -Path "ime-windows-$mode.txt" -Pattern "search field: 한국어" -Encoding utf8 -Quiet)) { $failed++ }
          }
          if ($failed) { throw "Korean did not arrive in $failed of 2 runs" }

      # Hanja (the Hanja key, 1 picks the first), 한/영 (the Hangul key), then Chinese with Microsoft Pinyin.
      - name: Hanja, 한/영 and Pinyin with the Microsoft IMEs
        shell: pwsh
        run: |
          foreach ($run in @(@("hanja", "{layout:00000412}{hangul}gks{hanja}1 {hangul}abc {hangul}rnr "), @("pinyin", "{layout:00000804}zhongwen "))) {
            $name = $run[0]
            $p = Start-Process build/Release/stardraft-next.exe -ArgumentList @("--workspace", "triggers", "--live", "30", "--snapshot", "ime-windows-$name.png") -RedirectStandardOutput "ime-windows-$name.txt" -PassThru
            for ($i = 0; $i -lt 60 -and -not (Select-String -Path "ime-windows-$name.txt" -Pattern "^ready" -Quiet -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Milliseconds 500 }
            pwsh -File tools/ci/ime_keys_windows.ps1 -ProcessId $p.Id -Keys $run[1]
            $p.WaitForExit(60000) | Out-Null
            Get-Content "ime-windows-$name.txt" -Encoding utf8
          }
          python tools/ci/ime_check.py hanja ime-windows-hanja.txt
          if ($LASTEXITCODE) { exit 1 }
          python tools/ci/ime_check.py pinyin ime-windows-pinyin.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ime-windows-${{ github.sha }}
          path: ime-windows-*

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: ime-deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --target stardraft_next --parallel
          clang tools/ci/ime_keys_mac.c -framework Carbon -framework ApplicationServices -o ime_keys_mac
          clang -fobjc-arc tools/ci/ime_textview_mac.m -framework Cocoa -o ime_textview_mac

      # A run of stardraft-next with the keys (live <name> <flags> <keys> <check>); on macOS the first launches after an
      # input method starts can lose the first syllable (ㅎㅏㄴ국어): a run that fails its check runs once more, with
      # a warning (so it shows).
      - name: Type Korean with 2-Set Korean
        run: |
          app=build/stardraft-next.app/Contents/MacOS/stardraft-next
          live() {
            local name=$1 flags=$2 keys=$3 check=$4
            for try in 1 2; do
              "$app" --workspace triggers $flags --live 30 --snapshot ime-macos-$name.png > ime-macos-$name.txt 2>&1 &
              local pid=$!
              for i in $(seq 1 60); do grep -q "^ready" ime-macos-$name.txt && break; sleep 0.5; done
              ./ime_keys_mac "$keys" || true
              wait $pid || true
              cat ime-macos-$name.txt
              python3 tools/ci/ime_check.py $check ime-macos-$name.txt && return 0
              [ $try = 1 ] && echo "::warning::macOS $name: $(grep 'search field' ime-macos-$name.txt), once more"
            done
            return 1
          }
          ko="{source:com.apple.inputmethod.Korean.2SetKorean}"
          # One launch to start the input method (keys right after it starts are lost), not counted.
          live warmup "" "${ko}gksrnrdj " korean || true
          live inline --ime-inline "gksrnrdj " korean
          live system --ime-system "gksrnrdj " korean
          # 한/영 (the English input source and back), then Pinyin - Simplified. Hanja (Option+Return) is tried and
          # reported only: with posted keys, 2-Set Korean commits the syllable instead of showing its Hanja (a person
          # checks it on a Mac).
          live hanja "" "gks{optreturn}{wait}{wait}1 {source:com.apple.keylayout.US}abc ${ko}rnr " hanja ||
            echo "::warning::macOS Hanja: $(grep 'search field' ime-macos-hanja.txt) (Option+Return gave no Hanja)"
          live hangul-english "" "gks {source:com.apple.keylayout.US}abc ${ko}rnr " hangul-english
          # The same Hanja keys into a native text view (NSTextView): what the input method gives without SDL.
          ./ime_textview_mac 15 > ime-macos-textview.txt 2>&1 &
          pid=$!
          for i in $(seq 1 40); do grep -q "^ready" ime-macos-textview.txt && break; sleep 0.5; done
          ./ime_keys_mac "${ko}gks{optreturn}{wait}{wait}1 " || true
          wait $pid || true
          cat ime-macos-textview.txt
          live warmup2 "" "{source:com.apple.inputmethod.SCIM.ITABC}zhongwen " pinyin || true
          live pinyin "" "zhongwen " pinyin

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ime-macos-${{ github.sha }}
          path: ime-macos-*
