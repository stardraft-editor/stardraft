# After each Build run of a push that keeps its compiler caches (master, port/kit, port/ci-*: KEEP_CACHE in build.yml):
# the branch's older compiler caches go, the newest of each kind stays. A run reads only the newest one (restore-keys),
# and GitHub keeps 10 GB for each repository: the old ones pushed out the others (the dependencies, the Flatpak's).
name: Caches

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [master, port/kit, 'port/ci-*']

permissions:
  actions: write  # to remove caches

jobs:
  prune:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Remove the older compiler caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          for kind in sccache-windows- ccache-linux-gcc- ccache-linux-clang- ccache-appimage- ccache-macos-; do
            gh cache list --ref "refs/heads/$BRANCH" --key "$kind" --sort created_at --order desc --limit 100 \
                --json id,key --jq '.[1:][] | "\(.id) \(.key)"' |
              while read -r id key; do
                echo "remove $key"
                gh cache delete "$id" || true  # (another run of this workflow may have removed it)
              done
          done
