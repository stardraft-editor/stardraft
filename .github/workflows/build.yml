# Builds stardraft.exe on every push (and on pull requests) and keeps it as a downloadable artifact.
# A tag v<version> (v0.5.0.1) makes a new release of that commit: "StarDraft <version> (build <commit>)", with
# StarDraft-<version>-win64.zip, marked Latest; its text is the "## <version>" section of docs/user/CHANGELOG.md
# (what is new), then the base changelog (its last section, what StarDraft is) for new visitors.
# StarDraft's Check for updates reads "(build <commit>)" in the newest release's title. Each release keeps its own
# download count. The tests need a StarCraft: Remastered install, so they are not run here.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to make a release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The UI text rules (docs/dev/PRINCIPLES.md, "Text"): a new violation stops the build. Needs only Python.
      - name: Check the UI text
        run: python -I tools/ui_text_lint.py

      # The translation tables (apps/editor/res/lang/*.inc) are made from the *.tsv files: a table that is not made
      # again after a change to its .tsv stops the build.
      - name: Check the translation tables
        run: |
          python -I tools/ui_lang_gen.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }  # a bad .tsv row: no tables are made
          git diff --exit-code -- apps/editor/res/lang

      # FetchContent sources (SDL3, StormLib, CascLib, stb): cached by the CMake file that pins them.
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: pwsh
        env:
          STARDRAFT_ISSUES_TOKEN: ${{ secrets.STARDRAFT_ISSUES_TOKEN }}  # crash reports go to Issues (apps/editor/crash.inc)
        run: |
          # A release tag (v0.5.0.1): the program says that version; other builds keep the version in CMakeLists.txt.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            cmake -S . -B build -A x64 "-DSTARDRAFT_VERSION_NAME=$($env:GITHUB_REF_NAME.Substring(1))"
          } else {
            cmake -S . -B build -A x64  # the newest Visual Studio on the runner
          }

      - name: Build
        run: cmake --build build --config Release --target stardraft_editor --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: stardraft-${{ github.sha }}
          path: build/Release/stardraft.exe
          if-no-files-found: error

      # The symbols of this build: open a crash report's crash.dmp with them (Visual Studio or WinDbg).
      - uses: actions/upload-artifact@v4
        with:
          name: stardraft-symbols-${{ github.sha }}
          path: build/Release/stardraft.pdb
          retention-days: 90

      # All the other targets (the test programs and tools): compiled only, not run. A target that does not compile
      # stops the build (and the release); the editor above is already uploaded.
      - name: Build all targets
        run: cmake --build build --config Release --parallel

      - name: Make the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}  # a new release is posted in Discord (#updates)
          DISCORD_GENERAL_WEBHOOK: ${{ secrets.DISCORD_GENERAL_WEBHOOK }}  # and in #general (a webhook of that channel)
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $zip = "StarDraft-$version-win64.zip"
          Copy-Item docs/user/CHANGELOG.md README.txt -Force  # the changelog, in the zip beside the program
          Compress-Archive -Force -Path build/Release/stardraft.exe, README.txt -DestinationPath $zip
          # The release's text: what is new in this version (the changelog's "## <version>" section), then the base
          # changelog (its last section: what StarDraft is and does, how to start), so a new visitor understands it.
          $sections = [ordered]@{}; $name = $null
          foreach ($line in Get-Content docs/user/CHANGELOG.md -Encoding utf8) {
            if ($line -match '^## (.+)$') { $name = $Matches[1].Trim(); $sections[$name] = @(); continue }
            if ($name) { $sections[$name] += $line }
          }
          $mine = $sections.Keys | Where-Object { $_ -eq $version -or $_.StartsWith("$version ") } | Select-Object -First 1
          $base = @($sections.Keys)[-1]
          $notes = @()
          if ($mine -and $mine -ne $base) { $notes += "## What is new in $version"; $notes += $sections[$mine]; $notes += '' }
          if ($base) { $notes += "## About StarDraft ($base)"; $notes += $sections[$base] }
          # Screenshots: the changelog's images/... paths become full addresses at this tag (the release text has no folder).
          $raw = "https://raw.githubusercontent.com/$($env:GITHUB_REPOSITORY)/$($env:GITHUB_REF_NAME)/docs/user/"
          $text = ($notes -join "`n") -replace '\]\((images/[^)\s]+)\)', "]($raw`$1)"
          Set-Content notes.md $text -Encoding utf8
          $title = "StarDraft 2 - v$version (build $($env:GITHUB_SHA.Substring(0, 7)))"
          gh release create $env:GITHUB_REF_NAME $zip --title $title --latest --verify-tag --notes-file notes.md
          # Discord: one post in each channel that has a webhook (a webhook posts in its own channel only), with the
          # screenshots of this version's changelog section as files (at most 10; Discord cannot load the private
          # repository's image addresses).
          $hooks = @($env:DISCORD_RELEASE_WEBHOOK, $env:DISCORD_GENERAL_WEBHOOK) | Where-Object { $_ }
          if ($hooks) {
            $url = gh release view $env:GITHUB_REF_NAME --json url --jq .url
            @{ content = "**$title** is out: $url" } | ConvertTo-Json | Set-Content payload.json -Encoding utf8NoBOM
            $images = @()
            if ($mine) {
              $images = @([regex]::Matches(($sections[$mine] -join "`n"), '\]\((images/[^)\s]+)\)') |
                ForEach-Object { "docs/user/" + $_.Groups[1].Value } | Where-Object { Test-Path $_ } | Select-Object -Unique -First 10)
            }
            foreach ($hook in $hooks) {
              $form = @('-sS', '--fail-with-body', '-F', 'payload_json=<payload.json')
              for ($i = 0; $i -lt $images.Count; $i++) { $form += @('-F', "files[$i]=@$($images[$i])") }
              curl.exe @form $hook
              if ($LASTEXITCODE -ne 0) { Write-Warning "The Discord post did not go ($LASTEXITCODE)" }
            }
          }
