# Builds and tests StarDraft on every push (and on pull requests) and keeps the files as artifacts of the run. A push to
# a branch never makes a release: a tag v<version> does, in .github/workflows/release.yml, from the files of this
# workflow's run of the same commit (it builds them again here only when there is no good run of that commit).
# The jobs: windows (stardraft.exe, CMake target stardraft_editor: built with MSVC and Ninja, snapshotted, then all the
# other targets), linux and linux-clang (the library, the tools and the tests with GCC and with Clang, and the editor's
# snapshots), linux-appimage (the AppImage), macos (the app and its disk image). Most tests need a StarCraft:
# Remastered install, so they are not run here (.github/workflows/data.yml: a self-hosted runner with the game data,
# off by default; a workflow of its own, so that a release never waits for that runner).
# The heavy extras (flatpak, linux-appimage-run, wine) run only on port/kit, main, tags and runs by hand; the
# release test of the macOS app (release-test-macos) only on port/kit, the port/t-* branches and by hand.
# A compiler cache in each build job (Windows: sccache; Linux and macOS: ccache), kept with actions/cache: each run
# takes the newest cache that it can see (its own branch's, else main's), and the pushes to main, port/kit and the
# port/ci-* branches keep their caches for the next runs (docs/dev/DEVELOPING.md, "CI").
# A release tag's version: tools/ci/version_name.sh (a push of a tagged commit builds it as that version).
name: Build

on:
  push:
    branches: ['**']
    # Docs only (docs/, *.md): no run. The files that CI or a release reads still start one: README.md and the
    # changelog (the UI text check), the changelog's pictures (a release's Discord post), the help pages (built into
    # the program: tools/help_build.py), the preview notes.
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - 'README.md'
      - 'docs/user/CHANGELOG.md'
      - 'docs/user/images/**'
      - 'docs/help/**'
      - 'tools/preview_notes.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
      - 'README.md'
      - 'docs/user/CHANGELOG.md'
      - 'docs/user/images/**'
      - 'docs/help/**'
      - 'tools/preview_notes.md'
  workflow_dispatch:
  workflow_call:  # (release.yml: a tag whose commit has no good run here)

permissions:
  contents: read

# A newer push to the same branch stops its older run (only the newest one counts). main and tags always go to the end.
concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  # The compiler caches are kept only by these pushes (a branch's run can read main's cache and its own).
  KEEP_CACHE: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/port/kit' || startsWith(github.ref, 'refs/heads/port/ci-')) }}

jobs:
  # The editor on Windows (stardraft.exe): the release's program and its symbols, its snapshots (on Direct3D 12, which
  # uses WARP, the CPU: GitHub's Windows machines have no GPU; no game data: the shell with no map), the program alone in
  # a folder as a release has it, then all the other targets.
  windows:
    runs-on: windows-latest
    env:
      SCCACHE_CACHE_SIZE: 3G
    steps:
      - uses: actions/checkout@v4

      - name: The compiler cache's folder
        shell: bash
        run: echo "SCCACHE_DIR=$RUNNER_TEMP\sccache" >> "$GITHUB_ENV"

      # The UI text rules (docs/dev/PRINCIPLES.md, "Text"): a new violation stops the build. Needs only Python.
      - name: Check the UI text
        run: python -I tools/ui_text_lint.py

      # The help pages (docs/help): each link goes to a page and a place that are there, and each .dat field has its
      # place (tools/help_build.py). The build makes the pages for the program with the same checks.
      - name: Check the help pages
        run: python -I tools/help_build.py --check

      # The translation tables (apps/editor/res/lang/*.cpp) are made from the *.tsv files: a table that is not made
      # again after a change to its .tsv stops the build.
      - name: Check the translation tables
        run: |
          python -I tools/ui_lang_gen.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }  # a bad .tsv row: no tables are made
          git diff --exit-code -- apps/editor/res/lang

      # FetchContent sources (SDL3, StormLib, CascLib, stb): cached by the CMake file that pins them.
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-ninja-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\sccache
          key: sccache-windows-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-windows-

      - uses: mozilla-actions/sccache-action@v0.0.9

      # MSVC's environment for Ninja (cl, link, rc), x64.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # A release's commit: the program says the tag's version; other builds keep the version in CMakeLists.txt.
      - name: The version name
        id: version
        shell: bash
        run: |
          version=$(bash tools/ci/version_name.sh)
          echo "Version name: ${version:-(CMakeLists.txt)}"
          echo "$version" > version-windows.txt
          echo "name=$version" >> "$GITHUB_OUTPUT"

      # Ninja Multi-Config: the files go to build/Release/, as with Visual Studio's generator.
      - name: Configure
        shell: pwsh
        env:
          STARDRAFT_ISSUES_TOKEN: ${{ secrets.STARDRAFT_ISSUES_TOKEN }}  # crash reports go to Issues (core/releases.inc)
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { python -m pip install ninja }
          ninja --version
          $version = $env:VERSION_NAME
          $opts = @('-G', 'Ninja Multi-Config', '-DCMAKE_C_COMPILER=cl', '-DCMAKE_CXX_COMPILER=cl',
                    '-DCMAKE_C_COMPILER_LAUNCHER=sccache', '-DCMAKE_CXX_COMPILER_LAUNCHER=sccache')
          if ($version) { $opts += "-DSTARDRAFT_VERSION_NAME=$version" }
          cmake -S . -B build @opts

      # The editor and the command-line program (stardraft-cli.exe, docs/dev/CLI.md): a release has both.
      - name: Build
        run: cmake --build build --config Release --target stardraft_editor stardraft_cli --parallel

      # The command-line program starts and answers (no game data here: `ops` needs none).
      - name: Check the command-line program
        shell: bash
        run: build/Release/stardraft-cli.exe ops | grep -q '"ok": *true'

      # stardraft.pdb is the one of this stardraft.exe (the same GUID and age): crash.dmp files open with it.
      - name: Check the symbols
        run: python -I tools/ci/pdb_check.py build/Release/stardraft.exe build/Release/stardraft.pdb

      # The programs: a release is these files (the editor's fonts and icons are in it).
      - uses: actions/upload-artifact@v4
        with:
          name: stardraft-${{ github.sha }}
          path: |
            build/Release/stardraft.exe
            build/Release/stardraft-cli.exe
          if-no-files-found: error

      # The symbols of this build: open a crash report's crash.dmp with them (Visual Studio or WinDbg).
      - uses: actions/upload-artifact@v4
        with:
          name: stardraft-symbols-${{ github.sha }}
          path: build/Release/stardraft.pdb
          retention-days: 90

      # The version name that this build has (empty: CMakeLists.txt's): release.yml takes this run's files only for that
      # version.
      - uses: actions/upload-artifact@v4
        with:
          name: build-version-windows-${{ github.sha }}
          path: version-windows.txt
          retention-days: 90

      # A test run (a snapshot) asks nothing, sends nothing and changes no settings or file types. APPDATA and
      # LOCALAPPDATA point to the run's own folder too.
      - name: Snapshot the editor
        shell: bash
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          export APPDATA="$RUNNER_TEMP\\appdata" LOCALAPPDATA="$RUNNER_TEMP\\localappdata"
          mkdir -p "$RUNNER_TEMP/appdata" "$RUNNER_TEMP/localappdata"
          exe=build/Release/stardraft.exe
          "$exe" --snapshot editor-windows.png | tee snap.txt
          grep -q "^wrote " snap.txt
          "$exe" --workspace files --snapshot editor-windows-files.png | tee snap.txt
          grep -q "^wrote " snap.txt
          "$exe" --dialog options --size 720x820 --snapshot editor-windows-options.png | tee snap.txt
          grep -q "^wrote " snap.txt
          # As a release has it: stardraft.exe alone in a folder (no res/, no fonts/ beside it). The icons come from the
          # program itself, the fonts from the system (Segoe UI).
          mkdir -p alone && cp "$exe" alone/
          alone/stardraft.exe --snapshot editor-windows-alone.png | tee snap.txt
          grep -q "^wrote " snap.txt
          grep -q "fonts segoeui.ttf" snap.txt
          if grep -q "no icon atlases\|no app icon" snap.txt; then exit 1; fi

      # Each workspace and dialog (tools/sdl_snapshots.py), as on Linux: a run exits with 0 and writes a PNG that is not
      # one flat color. No game data and no map here: the cases that need them are skipped (summary.txt).
      - name: Snapshot each workspace and dialog (WARP)
        shell: bash
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          export APPDATA="$RUNNER_TEMP\\appdata" LOCALAPPDATA="$RUNNER_TEMP\\localappdata"
          mkdir -p "$RUNNER_TEMP/appdata" "$RUNNER_TEMP/localappdata"
          python -I tools/sdl_snapshots.py --exe build/Release/stardraft.exe --out sdl-snapshots --jobs 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdl-snapshots-windows-${{ github.sha }}
          path: sdl-snapshots
          if-no-files-found: warn

      - name: Pack the editor
        if: always()
        run: Compress-Archive -Force -Path build/Release/stardraft.exe, build/Release/stardraft-cli.exe -DestinationPath stardraft-windows.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stardraft-editor-windows-${{ github.sha }}
          path: |
            editor-windows*.png
            stardraft-windows.zip

      # All the other targets (the test programs and tools): compiled only, not run. A target that does not compile
      # stops the build (and a release of this commit); the editor above is already uploaded.
      - name: Build all targets
        run: cmake --build build --config Release --parallel

      # For the Wine job: the renderer's test program, built for Windows.
      - uses: actions/upload-artifact@v4
        with:
          name: wine-test-${{ github.sha }}
          path: build/Release/render_smoke_test.exe
          retention-days: 7

      # stardraft-next (the new shell's spike), to try by hand: the program and its fonts. Not in a release.
      - uses: actions/upload-artifact@v4
        with:
          name: stardraft-next-windows-${{ github.sha }}
          path: |
            build/Release/stardraft-next.exe
            build/Release/fonts

      - name: The compiler cache
        if: ${{ !cancelled() }}
        run: sccache --show-stats

      - name: Keep the compiler cache
        if: ${{ !cancelled() && env.KEEP_CACHE == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\sccache
          key: sccache-windows-${{ github.run_id }}-${{ github.run_attempt }}

  # The library, the tools and the tests on Linux with GCC (research/ports/PLAN.md, phase 1): built, the tests that
  # need no game data run, and the editor is built and snapshotted (its artifact: stardraft-linux.tar.gz, not on a
  # release). The build with Clang is the job linux-clang.
  linux:
    runs-on: ubuntu-24.04
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4

      - name: The compiler cache's folder
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"

      # SDL's build dependencies (its docs/README-linux.md) and Mesa's Vulkan drivers (lavapipe: Vulkan on the CPU).
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache pkg-config mesa-vulkan-drivers libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev libdbus-1-dev libudev-dev \
            desktop-file-utils appstream shared-mime-info

      # The SPIR-V and MSL shaders in shaders/gen/ are made from the shaders as they are now.
      - name: Check the shaders for Vulkan and Metal
        run: python3 -I tools/gen_shaders.py --check

      - uses: actions/cache@v4
        with:
          path: build-gcc/_deps
          key: deps-gcc-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-gcc-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-gcc-

      - name: Build with GCC
        run: |
          cmake -S . -B build-gcc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSTARDRAFT_REQUIRE_DBUS=ON  # (SDL with D-Bus: the desktop portal's file dialogs)
          cmake --build build-gcc --parallel

      # The desktop's files (packaging/linux: the .desktop file, the file types, the metainfo, the thumbnailer, the
      # icons) as `cmake --install` puts them, checked with the desktops' own tools; the thumbnailer draws a map.
      - name: Check the desktop files and the thumbnailer
        run: |
          inst="$RUNNER_TEMP/inst"
          DESTDIR="$inst" cmake --install build-gcc --prefix /usr --component stardraft
          desktop-file-validate "$inst"/usr/share/applications/io.github.stardraft_editor.StarDraft.desktop
          appstreamcli validate --no-net "$inst"/usr/share/metainfo/io.github.stardraft_editor.StarDraft.metainfo.xml
          mkdir -p "$RUNNER_TEMP/mime" && cp -r "$inst/usr/share/mime/packages" "$RUNNER_TEMP/mime/"
          update-mime-database "$RUNNER_TEMP/mime"
          grep -q "application/x-starcraft-scx:\*.scx" "$RUNNER_TEMP/mime/globs2"
          for s in 16 24 32 48 64 128 256 512; do
            test -f "$inst/usr/share/icons/hicolor/${s}x${s}/apps/io.github.stardraft_editor.StarDraft.png"
          done
          build-gcc/map_preview_test "$RUNNER_TEMP/preview"
          "$inst/usr/bin/stardraft-thumbnailer" -s 128 "file://$RUNNER_TEMP/preview/test.scx" thumbnail-linux.png
          file thumbnail-linux.png | grep -q "PNG image data"

      # The UI text rules, trigger_test's checks without the game (the block library, the checker, epScript) and the
      # renderer on Vulkan (lavapipe, no window).
      - name: Run the tests that need no game data
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          python3 -I tools/ui_text_lint.py
          build-gcc/trigger_test "$RUNNER_TEMP/trigger_test"
          build-gcc/render_smoke_test "$RUNNER_TEMP/render_smoke.png"
          build-gcc/settings_test "$RUNNER_TEMP"
          build-gcc/commands_test
          build-gcc/help_test
          build-gcc/platform_test "$RUNNER_TEMP"
          build-gcc/kit_test
          build-gcc/pathing_regions_test

      # stardraft-next (the new shell's spike) with no window: a snapshot of each workspace, Korean and Chinese typed
      # into a field. The pictures are kept with the run.
      - name: Snapshot stardraft-next
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          build-gcc/stardraft-next --snapshot next-linux-map.png
          build-gcc/stardraft-next --workspace triggers --type "한국어 입력 中文" --snapshot next-linux-triggers.png | tee next.txt
          grep -q "search field: 한국어 입력 中文" next.txt
          build-gcc/stardraft-next --workspace triggers --ime-inline --type "한국어 입" --compose "력" --snapshot next-linux-ime.png | tee ime.txt
          grep -q "composing: 력" ime.txt

      # The control kit on SDL (apps/kit_sdl): its widgets and the Canvas's drawing in one picture.
      - name: Snapshot the kit demo
        env:
          SDL_VIDEODRIVER: offscreen
        run: build-gcc/kit-demo --snapshot kit-demo-linux.png

      - name: Pack stardraft-next
        if: always()
        run: tar -C build-gcc -czf stardraft-next-linux.tar.gz stardraft-next fonts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stardraft-next-linux-${{ github.sha }}
          path: |
            next-linux-*.png
            kit-demo-linux.png
            stardraft-next-linux.tar.gz

      # The editor on SDL (stardraft, research/ports/MAC-BUILD-PLAN.md step 6): its shell with no map open (no game data
      # here), its picture kept with the run, and the program in a tar.
      - name: Snapshot the editor
        env:
          SDL_VIDEODRIVER: offscreen
        run: build-gcc/stardraft --snapshot editor-linux.png

      # A workspace with no view on this system yet: the "Not on this system yet" view in its place.
      - name: Snapshot the editor (Assets workspace, no view yet)
        env:
          SDL_VIDEODRIVER: offscreen
        run: build-gcc/stardraft --workspace files --snapshot editor-linux-files.png

      # Each workspace and dialog of the editor on SDL (tools/sdl_snapshots.py): a run exits with 0 and writes a PNG
      # that is not one flat color. No game data and no map here: the cases that need them are skipped (the list is in
      # summary.txt).
      - name: Snapshot each workspace and dialog
        env:
          SDL_VIDEODRIVER: offscreen
        run: python3 -I tools/sdl_snapshots.py --exe build-gcc/stardraft --out sdl-snapshots --jobs 3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdl-snapshots-linux-${{ github.sha }}
          path: sdl-snapshots
          if-no-files-found: warn

      - name: Pack the editor
        if: always()
        run: tar -C build-gcc -czf stardraft-linux.tar.gz stardraft res fonts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stardraft-editor-linux-${{ github.sha }}
          path: |
            editor-linux.png
            editor-linux-files.png
            stardraft-linux.tar.gz

      - name: The compiler cache
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      - name: Keep the compiler cache
        if: ${{ !cancelled() && env.KEEP_CACHE == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-gcc-${{ github.run_id }}-${{ github.run_attempt }}

  # All targets with Clang (its warnings and errors), and the kit's tests with AddressSanitizer and
  # UndefinedBehaviorSanitizer (GCC): a widget that uses a view after it went away (a pop-up closed in its own
  # callback, a removed child) fails here. Beside the linux job, at the same time.
  linux-clang:
    runs-on: ubuntu-24.04
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4

      - name: The compiler cache's folder
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache clang pkg-config libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev libdbus-1-dev libudev-dev

      - uses: actions/cache@v4
        with:
          path: build-clang/_deps
          key: deps-clang-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-clang-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-clang-

      - name: Build with Clang
        run: |
          cmake -S . -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-clang --parallel

      # (each file compiled on its own, all at once, then linked in the same order as one g++ command would)
      - name: Kit tests with sanitizers
        run: |
          flags="-std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          mkdir -p kit-asan
          ls apps/kit/*.cpp tools/tests/kit_test.cpp tools/tests/kit/*.cpp > kit-asan/sources.txt
          xargs -P "$(nproc)" -I{} sh -c 'ccache g++ $0 -Iapps/common -Iapps/kit -Itools/tests -c "$1" -o "kit-asan/$(echo "$1" | tr / _).o"' "$flags" {} < kit-asan/sources.txt
          g++ $flags $(sed 's|/|_|g; s|^|kit-asan/|; s|$|.o|' kit-asan/sources.txt) -o kit_test_asan
          ./kit_test_asan

      - name: The compiler cache
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      - name: Keep the compiler cache
        if: ${{ !cancelled() && env.KEEP_CACHE == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-linux-clang-${{ github.run_id }}-${{ github.run_attempt }}

  # The AppImage (tools/ci/linux_appimage.sh): built on Ubuntu 22.04, the oldest system it is for (its glibc), with
  # GCC 12 and the C++ library in the program. It is kept with the run.
  linux-appimage:
    runs-on: ubuntu-22.04
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 1G
    steps:
      - uses: actions/checkout@v4

      - name: The compiler cache's folder
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache g++-12 pkg-config libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev libdbus-1-dev libudev-dev

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-appimage-${{ hashFiles('CMakeLists.txt') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-appimage-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-appimage-

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-12 -DCMAKE_C_COMPILER=gcc-12 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSTARDRAFT_STATIC_LIBSTDCXX=ON -DSTARDRAFT_REQUIRE_DBUS=ON -DSTARDRAFT_NEXT=OFF
          cmake --build build --parallel --target stardraft_editor stardraft_thumbnailer -- -k 0  # (all the errors at once)

      - name: Make the AppImage
        run: bash tools/ci/linux_appimage.sh build StarDraft-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: stardraft-appimage-${{ github.sha }}
          path: StarDraft-x86_64.AppImage
          if-no-files-found: error

      - name: The compiler cache
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      - name: Keep the compiler cache
        if: ${{ !cancelled() && env.KEEP_CACHE == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-appimage-${{ github.run_id }}-${{ github.run_attempt }}

  # The AppImage starts on the oldest and on the newest Ubuntu (a container of ubuntu:rolling): a snapshot without a
  # window (Vulkan on the CPU: lavapipe), and what the program finds of the desktop (--check desktop).
  linux-appimage-run:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/port/kit' || startsWith(github.ref, 'refs/tags/')
    needs: linux-appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-22.04
            os: ubuntu-22.04
            container: ''
          - name: ubuntu-rolling
            os: ubuntu-24.04
            container: ubuntu:rolling
    name: linux-appimage-run (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stardraft-appimage-${{ github.sha }}

      - name: Install Vulkan on the CPU
        run: |
          if [ "$(id -u)" = 0 ]; then sudo=; else sudo=sudo; fi
          $sudo apt-get update
          DEBIAN_FRONTEND=noninteractive $sudo apt-get install -y mesa-vulkan-drivers libvulkan1 file

      - name: Start the AppImage
        env:
          SDL_VIDEODRIVER: offscreen
          APPIMAGE_EXTRACT_AND_RUN: 1  # (no FUSE on these machines)
        run: |
          chmod +x StarDraft-x86_64.AppImage
          mkdir -p "$RUNNER_TEMP/desktop"
          ./StarDraft-x86_64.AppImage --check "desktop:$RUNNER_TEMP/desktop" --check settings --check crashes --snapshot appimage-${{ matrix.name }}.png | tee run.txt
          grep -q "^wrote " run.txt
          grep -q "^settings: file .*/StarDraft/settings.json" run.txt
          grep -q "^crashes: the next start" run.txt
          # A crash writes its report (a test run: it is not sent), and the next start's check sees it.
          if ./StarDraft-x86_64.AppImage --crash-test; then echo "--crash-test did not crash"; exit 1; fi
          ./StarDraft-x86_64.AppImage --check crashes --snapshot crash-check.png | tee crash.txt
          grep -q "^crashes: report .*report.txt [1-9][0-9]* bytes, crash.dmp no, a test run: not sent" crash.txt
          grep -q "^desktop: package AppImage" run.txt
          grep -q "^desktop: app id io.github.stardraft_editor.StarDraft; SDL app id io.github.stardraft_editor.StarDraft" run.txt
          if grep -q "no icon atlases\|no app icon\|(WRONG)" run.txt; then exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appimage-snapshot-${{ matrix.name }}-${{ github.sha }}
          path: appimage-*.png
          if-no-files-found: warn

  # The Flatpak (packaging/flatpak): built with flatpak-builder in the Freedesktop runtime, as Flathub builds it, and
  # kept with the run as a bundle (flatpak install --user stardraft.flatpak).
  flatpak:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/port/kit' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: stardraft.flatpak
          manifest-path: packaging/flatpak/io.github.stardraft_editor.StarDraft.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/*.yml', 'CMakeLists.txt') }}
          upload-artifact: true

  macos:
    runs-on: macos-15  # arm64, Xcode's clang and libc++
    env:
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4

      - name: The compiler cache's folder
        run: echo "CCACHE_DIR=$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Restore the compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-macos-

      - name: Install ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install ccache

      # A release's commit (v0.5.0.1): the app says that version (as the Windows release); the issues token, as there.
      - name: Build
        env:
          STARDRAFT_ISSUES_TOKEN: ${{ secrets.STARDRAFT_ISSUES_TOKEN }}
        run: |
          version_name=$(bash tools/ci/version_name.sh)
          echo "Version name: ${version_name:-(CMakeLists.txt)}"
          echo "$version_name" > version-macos.txt
          version=()
          [ -n "$version_name" ] && version=("-DSTARDRAFT_VERSION_NAME=$version_name")
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache "${version[@]}"
          cmake --build build --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: build-version-macos-${{ github.sha }}
          path: version-macos.txt
          retention-days: 90

      # The editor's app: its Info.plist is good (document types .scm and .scx, exported, the version), its icon is the
      # one that tools/make_icns.py makes from the Windows icon, the map type's name is translated, and the Quick Look
      # extensions are in PlugIns with their own Info.plist.
      - name: Check the editor's app bundle
        run: |
          python3 -I tools/make_icns.py --check
          plutil -lint build/stardraft.app/Contents/Info.plist
          plutil -p build/stardraft.app/Contents/Info.plist | grep -E "CFBundleShortVersionString|CFBundleIconFile|UTExportedTypeDeclarations|scx"
          test -f build/stardraft.app/Contents/Resources/stardraft.icns
          for l in ko es ru zh-Hans; do plutil -lint "build/stardraft.app/Contents/Resources/$l.lproj/InfoPlist.strings"; done
          cat build/stardraft.app/Contents/Resources/ko.lproj/InfoPlist.strings
          for x in StarDraftPreview StarDraftThumbnail; do
            plutil -lint "build/stardraft.app/Contents/PlugIns/$x.appex/Contents/Info.plist"
            plutil -p "build/stardraft.app/Contents/PlugIns/$x.appex/Contents/Info.plist" | grep -E "NSExtensionPointIdentifier|map-scx"
            codesign -d --entitlements - "build/stardraft.app/Contents/PlugIns/$x.appex" | grep -q app-sandbox
          done

      - name: Run the tests that need no game data
        run: |
          build/trigger_test "$RUNNER_TEMP/trigger_test"
          build/settings_test "$RUNNER_TEMP"
          build/commands_test
          build/help_test
          build/platform_test "$RUNNER_TEMP"
          build/kit_test
          build/pathing_regions_test
          build/map_preview_test "$RUNNER_TEMP/map_preview_test"

      # The renderer on Metal. GitHub's macOS machines may have no Metal device: a failure here does not stop the run.
      - name: Run the renderer on Metal
        continue-on-error: true
        run: build/render_smoke_test "$RUNNER_TEMP/render_smoke.png"

      # (GitHub's macOS machines have had a Metal device; if one has none, the snapshot fails and the run goes on)
      - name: Snapshot stardraft-next (Metal)
        continue-on-error: true
        run: |
          app=build/stardraft-next.app/Contents/MacOS/stardraft-next
          "$app" --snapshot next-macos-map.png
          "$app" --workspace triggers --type "한국어 입력 中文" --snapshot next-macos-triggers.png | tee next.txt
          grep -q "search field: 한국어 입력 中文" next.txt
          "$app" --workspace triggers --ime-inline --type "한국어 입" --compose "력" --snapshot next-macos-ime.png | tee ime.txt
          grep -q "composing: 력" ime.txt

      - name: Snapshot the kit demo (Metal)
        continue-on-error: true
        run: build/kit-demo.app/Contents/MacOS/kit-demo --snapshot kit-demo-macos.png

      # The app in a tar (an artifact keeps no file modes: the program would not start); and the snapshots.
      - name: Pack stardraft-next
        if: always()
        run: tar -C build -czf stardraft-next-macos.tar.gz stardraft-next.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stardraft-next-macos-${{ github.sha }}
          path: |
            next-macos-*.png
            kit-demo-macos.png
            stardraft-next-macos.tar.gz

      # The editor on SDL (stardraft, research/ports/MAC-BUILD-PLAN.md step 6): its shell with no map open, and the app.
      - name: Snapshot the editor (Metal)
        run: build/stardraft.app/Contents/MacOS/stardraft --snapshot editor-macos.png

      - name: Snapshot the editor (Assets workspace, Metal, no view yet)
        continue-on-error: true
        run: build/stardraft.app/Contents/MacOS/stardraft --workspace files --snapshot editor-macos-files.png

      # Each workspace and dialog (tools/sdl_snapshots.py), as on Linux (a failure stops the run: it has passed on GitHub's Metal).
      - name: Snapshot each workspace and dialog (Metal)
        run: python3 -I tools/sdl_snapshots.py --exe build/stardraft.app/Contents/MacOS/stardraft --out sdl-snapshots --jobs 2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdl-snapshots-macos-${{ github.sha }}
          path: sdl-snapshots
          if-no-files-found: warn

      - name: Pack the editor
        if: always()
        run: tar -C build -czf stardraft-macos.tar.gz stardraft.app

      # The download for Mac users (tools/ci/mac_dist.sh): StarDraft.app in a disk image with a background and a link
      # to Applications. Signed with the Developer ID and notarized when the repository has the secrets (forks and pull
      # requests do not: then signed ad hoc, and the log says that signing was skipped). docs/dev/DEVELOPING.md tells how.
      # A release's commit: StarDraft-<version>-macos-arm64.dmg, the name on the release.
      - name: Make the disk image
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          version_name=$(cat version-macos.txt)
          if [ -n "$version_name" ]; then name="StarDraft-$version_name-macos-arm64.dmg"; else name="StarDraft-macos-arm64.dmg"; fi
          mkdir -p dist
          bash tools/ci/mac_dist.sh build/stardraft.app "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: stardraft-dmg-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stardraft-editor-macos-${{ github.sha }}
          path: |
            editor-macos.png
            editor-macos-files.png
            stardraft-macos.tar.gz

      - name: The compiler cache
        if: ${{ !cancelled() }}
        run: ccache --show-stats

      - name: Keep the compiler cache
        if: ${{ !cancelled() && env.KEEP_CACHE == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-macos-${{ github.run_id }}-${{ github.run_attempt }}

  # The release test of the macOS app (tools/ci/mac_release_test.py): the macos job's disk image on another of GitHub's
  # macOS machines, as a user gets it: mounted, the app copied to an Applications folder and started from there, its
  # signature, map types and Quick Look extensions; the snapshots with no game data, a session of 10 minutes (the memory
  # flat), the real window (it never takes the focus: Metal, the Retina scale, resize, minimize, full screen), text
  # input in Korean and Japanese, the crash reports and Check for updates. Only for pushes to port/kit and the port/t-*
  # branches, and by hand (not on main).
  release-test-macos:
    if: github.ref != 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/port/kit' || startsWith(github.ref, 'refs/heads/port/t-'))))
    needs: macos
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: stardraft-dmg-${{ github.sha }}
          path: dist

      - name: Test the app of the disk image
        run: python3 -I tools/ci/mac_release_test.py --dmg "$(ls dist/*.dmg | head -n 1)" --out "$RUNNER_TEMP/release-test" --minutes 10

      # The outputs and pictures (not the app, the runs' home folders or the mount point).
      - name: Collect the outputs
        if: always()
        run: |
          mkdir -p release-test-macos
          rsync -a --exclude 'home-*' --exclude 'Applications' --exclude 'mnt' "$RUNNER_TEMP/release-test/" release-test-macos/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-macos-${{ github.sha }}
          path: release-test-macos
          if-no-files-found: warn

  # The Windows build under Wine on Linux (research/ports/PLAN.md, phase 2): the renderer on Vulkan (Wine passes it to
  # the system's Vulkan, here lavapipe) and on Direct3D 12 (Wine's vkd3d makes it Vulkan). Only reports: Wine is a
  # stopgap for Linux users, not a release target.
  wine:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/port/kit' || startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wine-test-${{ github.sha }}

      - name: Install Wine and Mesa's Vulkan drivers
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine mesa-vulkan-drivers xvfb

      - name: The renderer under Wine
        run: |
          export WINEDEBUG=-all
          xvfb-run -a wineboot -i  # (the Wine prefix)
          wine --version
          xvfb-run -a wine render_smoke_test.exe 2>&1 | tee wine-d3d12.txt || true
          STARDRAFT_GPU_DRIVER=vulkan xvfb-run -a wine render_smoke_test.exe 2>&1 | tee wine-vulkan.txt || true
          grep -q "0 failures" wine-vulkan.txt
