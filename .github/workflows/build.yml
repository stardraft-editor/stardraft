# Builds stardraft.exe (the editor, CMake target stardraft_editor) on every push (and on pull requests) and keeps it as
# a downloadable artifact. A push to a branch never makes a release.
# A tag v<version> (v0.5.0.1; `python -I tools/release.py publish <version> --yes` makes it) makes the release of that
# commit: "StarDraft 2 - v<version> (build <commit>)", with StarDraft-<version>-win64.zip (stardraft.exe only: its fonts
# and icons are in it, so an installed stardraft.exe, also the Windows program of an older release, updates to it), marked
# Latest; its text is the "## <version>" section of docs/user/CHANGELOG.md (what is new), then the base changelog (its
# last section, what StarDraft is) for new visitors. The symbols go to a draft release symbols-v<version>.
# The macOS disk image (StarDraft-<version>-macos-arm64.dmg: the macos job, tools/ci/mac_dist.sh) goes on the release too
# (the job macos-release).
# StarDraft's Check for updates reads "(build <commit>)" in the newest release's title. Each release keeps its own
# download count. Most tests need a StarCraft: Remastered install, so they are not run here. The jobs linux and macos
# build the library, the tools and the tests on those systems; the job windows-sdl builds stardraft.exe and snapshots it
# (tools/sdl_snapshots.py).
name: Build

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to make a release

# A newer push to the same branch stops its older build (only the newest one counts); a tag's run always goes to its end.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A release tag: the tag is a version, its changelog section and pictures are good, and the commit is on main.
      # Checked first, so a bad tag stops in seconds and not after the build.
      - name: Check the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I tools/release.py ci-check $env:GITHUB_REF_NAME

      # The UI text rules (docs/dev/PRINCIPLES.md, "Text"): a new violation stops the build. Needs only Python.
      - name: Check the UI text
        run: python -I tools/ui_text_lint.py

      # The translation tables (apps/editor/res/lang/*.cpp) are made from the *.tsv files: a table that is not made
      # again after a change to its .tsv stops the build.
      - name: Check the translation tables
        run: |
          python -I tools/ui_lang_gen.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }  # a bad .tsv row: no tables are made
          git diff --exit-code -- apps/editor/res/lang

      # FetchContent sources (SDL3, StormLib, CascLib, stb): cached by the CMake file that pins them.
      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: pwsh
        env:
          STARDRAFT_ISSUES_TOKEN: ${{ secrets.STARDRAFT_ISSUES_TOKEN }}  # crash reports go to Issues (core/releases.inc)
        run: |
          # A release tag (v0.5.0.1): the program says that version; other builds keep the version in CMakeLists.txt.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            cmake -S . -B build -A x64 "-DSTARDRAFT_VERSION_NAME=$($env:GITHUB_REF_NAME.Substring(1))"
          } else {
            cmake -S . -B build -A x64  # the newest Visual Studio on the runner
          }

      - name: Build
        run: cmake --build build --config Release --target stardraft_editor --parallel

      # The program only: a release is this file (its fonts and icons are in it).
      - uses: actions/upload-artifact@v4
        with:
          name: stardraft-${{ github.sha }}
          path: build/Release/stardraft.exe
          if-no-files-found: error

      # The symbols of this build: open a crash report's crash.dmp with them (Visual Studio or WinDbg).
      - uses: actions/upload-artifact@v4
        with:
          name: stardraft-symbols-${{ github.sha }}
          path: build/Release/stardraft.pdb
          retention-days: 90

      # All the other targets (the test programs and tools): compiled only, not run. A target that does not compile
      # stops the build (and the release); the editor above is already uploaded.
      - name: Build all targets
        run: cmake --build build --config Release --parallel

      # For the Wine job: the renderer's test program, built for Windows.
      - uses: actions/upload-artifact@v4
        with:
          name: wine-test-${{ github.sha }}
          path: build/Release/render_smoke_test.exe
          retention-days: 7

      # stardraft-next (the new shell's spike), to try by hand: the program and its fonts. Not in a release.
      - uses: actions/upload-artifact@v4
        with:
          name: stardraft-next-windows-${{ github.sha }}
          path: |
            build/Release/stardraft-next.exe
            build/Release/fonts

      - name: Make the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}  # a new release is posted in Discord (#updates)
          DISCORD_GENERAL_WEBHOOK: ${{ secrets.DISCORD_GENERAL_WEBHOOK }}  # and in #general (a webhook of that channel)
        run: |
          $tag = $env:GITHUB_REF_NAME; $version = $tag.Substring(1)
          $zip = "StarDraft-$version-win64.zip"
          Compress-Archive -Force -Path build/Release/stardraft.exe -DestinationPath $zip  # the program only (the notes are on the release page)
          # The text: what is new in this version (its changelog section), then the base changelog (what StarDraft is
          # and does, how to start) for new visitors; picture paths become addresses at this tag. tools/release.py
          # makes it, the same text that `release.py notes <version>` shows before a release.
          python -I tools/release.py notes $version --tag $tag --out notes.md
          if ($LASTEXITCODE) { throw "No release text for $version" }
          $title = python -I tools/release.py title $version
          # A run again (Re-run of a failed run): a release that has its zip stays as it is (people can have that zip,
          # and its symbols match it); a release without its zip gets this build's zip and symbols.
          $assets = gh release view $tag --json assets --jq '.assets[].name' 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and @($assets) -contains $zip) {
            Write-Output "The release $tag has its zip: nothing changes. A post that did not go: Actions > Post screenshots to Discord."
            exit 0
          }
          # The symbols first (stardraft.pdb), so that the kept symbols match the zip that goes out: a draft release
          # symbols-<tag>, which only the repository's members see, kept for good (an artifact goes after 90 days), to
          # read crash reports' crash.dmp files. Not on the release page.
          $sym = "StarDraft-$version-symbols.zip"
          Compress-Archive -Force -Path build/Release/stardraft.pdb -DestinationPath $sym
          $kept = @(gh release list --limit 200 --json tagName --jq '.[].tagName')
          if ($kept -contains "symbols-$tag") {
            gh release upload "symbols-$tag" $sym --clobber  # (its zip did not go out: these symbols replace them)
          } else {
            gh release create "symbols-$tag" $sym --draft --target $env:GITHUB_SHA --title "Symbols of $title" `
              --notes "stardraft.pdb of $title, for its crash reports (crash.dmp). A draft: only the repository's members see it."
          }
          if ($LASTEXITCODE) { throw "The symbols were not kept ($LASTEXITCODE)" }
          if ($exists) {
            gh release upload $tag $zip
          } else {
            gh release create $tag $zip --title $title --latest --verify-tag --notes-file notes.md
          }
          if ($LASTEXITCODE) { throw "The release $tag was not made ($LASTEXITCODE)" }
          # Discord: one post in each channel that has a webhook (a webhook posts in its own channel only), with the
          # screenshots of this version's changelog section as files (at most 10). A post that does not go makes the
          # run fail after the release is out: post again in that channel with Actions > Post screenshots to Discord.
          $hooks = @($env:DISCORD_RELEASE_WEBHOOK, $env:DISCORD_GENERAL_WEBHOOK) | Where-Object { $_ }
          if (-not $hooks) { throw 'No Discord webhook (DISCORD_RELEASE_WEBHOOK, DISCORD_GENERAL_WEBHOOK): the release is out, not posted' }
          $url = gh release view $tag --json url --jq .url
          @{ content = "**$title** is out: $url" } | ConvertTo-Json | Set-Content payload.json -Encoding utf8NoBOM
          $images = @(python -I tools/release.py notes $version --images)
          $failed = 0
          foreach ($hook in $hooks) {
            $form = @('-sS', '--fail-with-body', '-F', 'payload_json=<payload.json')
            for ($i = 0; $i -lt $images.Count; $i++) { $form += @('-F', "files[$i]=@$($images[$i])") }
            curl.exe @form $hook
            if ($LASTEXITCODE -ne 0) {
              $failed++
              Write-Warning "The Discord post did not go to $(if ($hook -eq $env:DISCORD_RELEASE_WEBHOOK) { 'updates' } else { 'general' }) ($LASTEXITCODE)"
            }
          }
          if ($failed) { throw "$failed Discord posts did not go: post again with Actions > Post screenshots to Discord" }

  # The editor on Windows (stardraft.exe, CMake target stardraft_editor): the same main_sdl.cpp as on Linux and macOS,
  # built with MSVC. Its snapshots draw without a window (SDL_VIDEODRIVER=offscreen) on Direct3D 12; GitHub's Windows
  # machines have no GPU, so Direct3D 12 uses WARP (the CPU). There is no game data here: the snapshots show the shell
  # with no map. The release's stardraft.exe is the windows job's build of the same target.
  windows-sdl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-sdl-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --target stardraft_editor --parallel

      # A test run (a snapshot) asks nothing, sends nothing and changes no settings or file types. APPDATA and
      # LOCALAPPDATA point to the run's own folder too. GitHub's machines draw with WARP (D3D12 in software).
      - name: Snapshot the editor
        shell: bash
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          export APPDATA="$RUNNER_TEMP\\appdata" LOCALAPPDATA="$RUNNER_TEMP\\localappdata"
          mkdir -p "$RUNNER_TEMP/appdata" "$RUNNER_TEMP/localappdata"
          exe=build/Release/stardraft.exe
          "$exe" --snapshot editor-windows.png | tee snap.txt
          grep -q "^wrote " snap.txt
          "$exe" --workspace files --snapshot editor-windows-files.png | tee snap.txt
          grep -q "^wrote " snap.txt
          "$exe" --dialog options --size 720x820 --snapshot editor-windows-options.png | tee snap.txt
          grep -q "^wrote " snap.txt
          # As a release has it: stardraft.exe alone in a folder (no res/, no fonts/ beside it). The icons come from the
          # program itself, the fonts from the system (Segoe UI).
          mkdir -p alone && cp "$exe" alone/
          alone/stardraft.exe --snapshot editor-windows-alone.png | tee snap.txt
          grep -q "^wrote " snap.txt
          grep -q "fonts segoeui.ttf" snap.txt
          if grep -q "no icon atlases\|no app icon" snap.txt; then exit 1; fi

      # Each workspace and dialog (tools/sdl_snapshots.py), as on Linux: a run exits with 0 and writes a PNG that is not
      # one flat color. No game data and no map here: the cases that need them are skipped (summary.txt).
      - name: Snapshot each workspace and dialog (WARP)
        shell: bash
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          export APPDATA="$RUNNER_TEMP\\appdata" LOCALAPPDATA="$RUNNER_TEMP\\localappdata"
          mkdir -p "$RUNNER_TEMP/appdata" "$RUNNER_TEMP/localappdata"
          python -I tools/sdl_snapshots.py --exe build/Release/stardraft.exe --out sdl-snapshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdl-snapshots-windows-${{ github.sha }}
          path: sdl-snapshots
          if-no-files-found: warn

      - name: Pack the editor
        if: always()
        run: Compress-Archive -Force -Path build/Release/stardraft.exe -DestinationPath stardraft-windows.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stardraft-editor-windows-${{ github.sha }}
          path: |
            editor-windows*.png
            stardraft-windows.zip

  # The library, the tools and the tests on Linux and macOS (research/ports/PLAN.md, phase 1): built, and the tests
  # that need no game data run. No program for these systems yet, so nothing is uploaded and no release waits for them.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # SDL's build dependencies (its docs/README-linux.md) and Mesa's Vulkan drivers (lavapipe: Vulkan on the CPU).
      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang pkg-config mesa-vulkan-drivers libasound2-dev libpulse-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev libdbus-1-dev libudev-dev

      # The SPIR-V and MSL shaders in shaders/gen/ are made from the shaders as they are now.
      - name: Check the shaders for Vulkan and Metal
        run: python3 -I tools/gen_shaders.py --check

      - uses: actions/cache@v4
        with:
          path: |
            build-gcc/_deps
            build-clang/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Build with GCC
        run: |
          cmake -S . -B build-gcc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++ -DCMAKE_C_COMPILER=gcc
          cmake --build build-gcc --parallel

      - name: Build with Clang
        run: |
          cmake -S . -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
          cmake --build build-clang --parallel

      # The UI text rules, trigger_test's checks without the game (the block library, the checker, epScript) and the
      # renderer on Vulkan (lavapipe, no window).
      - name: Run the tests that need no game data
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          python3 -I tools/ui_text_lint.py
          build-gcc/trigger_test "$RUNNER_TEMP/trigger_test"
          build-gcc/render_smoke_test "$RUNNER_TEMP/render_smoke.png"
          build-gcc/settings_test "$RUNNER_TEMP"
          build-gcc/commands_test
          build-gcc/platform_test "$RUNNER_TEMP"
          build-gcc/kit_test

      # stardraft-next (the new shell's spike) with no window: a snapshot of each workspace, Korean and Chinese typed
      # into a field. The pictures are kept with the run.
      - name: Snapshot stardraft-next
        env:
          SDL_VIDEODRIVER: offscreen
        run: |
          build-gcc/stardraft-next --snapshot next-linux-map.png
          build-gcc/stardraft-next --workspace triggers --type "한국어 입력 中文" --snapshot next-linux-triggers.png | tee next.txt
          grep -q "search field: 한국어 입력 中文" next.txt
          build-gcc/stardraft-next --workspace triggers --ime-inline --type "한국어 입" --compose "력" --snapshot next-linux-ime.png | tee ime.txt
          grep -q "composing: 력" ime.txt

      # The kit's tests again with AddressSanitizer and UndefinedBehaviorSanitizer: a widget that uses a view after it
      # went away (a pop-up closed in its own callback, a removed child) fails here.
      - name: Kit tests with sanitizers
        run: |
          g++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer             -Iapps/common -Iapps/kit -Itools/tests apps/kit/*.cpp tools/tests/kit_test.cpp tools/tests/kit/*.cpp -o kit_test_asan
          ./kit_test_asan

      # The control kit on SDL (apps/kit_sdl): its widgets and the Canvas's drawing in one picture.
      - name: Snapshot the kit demo
        env:
          SDL_VIDEODRIVER: offscreen
        run: build-gcc/kit-demo --snapshot kit-demo-linux.png

      - name: Pack stardraft-next
        if: always()
        run: tar -C build-gcc -czf stardraft-next-linux.tar.gz stardraft-next fonts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stardraft-next-linux-${{ github.sha }}
          path: |
            next-linux-*.png
            kit-demo-linux.png
            stardraft-next-linux.tar.gz

      # The editor on SDL (stardraft, research/ports/MAC-BUILD-PLAN.md step 6): its shell with no map open (no game data
      # here), its picture kept with the run, and the program in a tar.
      - name: Snapshot the editor
        env:
          SDL_VIDEODRIVER: offscreen
        run: build-gcc/stardraft --snapshot editor-linux.png

      # A workspace with no view on this system yet: the "Not on this system yet" view in its place.
      - name: Snapshot the editor (Assets workspace, no view yet)
        env:
          SDL_VIDEODRIVER: offscreen
        run: build-gcc/stardraft --workspace files --snapshot editor-linux-files.png

      # Each workspace and dialog of the editor on SDL (tools/sdl_snapshots.py): a run exits with 0 and writes a PNG
      # that is not one flat color. No game data and no map here: the cases that need them are skipped (the list is in
      # summary.txt).
      - name: Snapshot each workspace and dialog
        env:
          SDL_VIDEODRIVER: offscreen
        run: python3 -I tools/sdl_snapshots.py --exe build-gcc/stardraft --out sdl-snapshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdl-snapshots-linux-${{ github.sha }}
          path: sdl-snapshots
          if-no-files-found: warn

      - name: Pack the editor
        if: always()
        run: tar -C build-gcc -czf stardraft-linux.tar.gz stardraft res fonts

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stardraft-editor-linux-${{ github.sha }}
          path: |
            editor-linux.png
            editor-linux-files.png
            stardraft-linux.tar.gz

  macos:
    runs-on: macos-15  # arm64, Xcode's clang and libc++
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # A release tag (v0.5.0.1): the app says that version (as the Windows release); the issues token, as there.
      - name: Build
        env:
          STARDRAFT_ISSUES_TOKEN: ${{ secrets.STARDRAFT_ISSUES_TOKEN }}
        run: |
          version=()
          case "$GITHUB_REF" in refs/tags/v*) version=("-DSTARDRAFT_VERSION_NAME=${GITHUB_REF_NAME#v}") ;; esac
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 "${version[@]}"
          cmake --build build --parallel

      # The editor's app: its Info.plist is good (document types .scm and .scx, exported, the version), its icon is the
      # one that tools/make_icns.py makes from the Windows icon, the map type's name is translated, and the Quick Look
      # extensions are in PlugIns with their own Info.plist.
      - name: Check the editor's app bundle
        run: |
          python3 -I tools/make_icns.py --check
          plutil -lint build/stardraft.app/Contents/Info.plist
          plutil -p build/stardraft.app/Contents/Info.plist | grep -E "CFBundleShortVersionString|CFBundleIconFile|UTExportedTypeDeclarations|scx"
          test -f build/stardraft.app/Contents/Resources/stardraft.icns
          for l in ko es ru zh-Hans; do plutil -lint "build/stardraft.app/Contents/Resources/$l.lproj/InfoPlist.strings"; done
          cat build/stardraft.app/Contents/Resources/ko.lproj/InfoPlist.strings
          for x in StarDraftPreview StarDraftThumbnail; do
            plutil -lint "build/stardraft.app/Contents/PlugIns/$x.appex/Contents/Info.plist"
            plutil -p "build/stardraft.app/Contents/PlugIns/$x.appex/Contents/Info.plist" | grep -E "NSExtensionPointIdentifier|map-scx"
            codesign -d --entitlements - "build/stardraft.app/Contents/PlugIns/$x.appex" | grep -q app-sandbox
          done

      - name: Run the tests that need no game data
        run: |
          build/trigger_test "$RUNNER_TEMP/trigger_test"
          build/settings_test "$RUNNER_TEMP"
          build/commands_test
          build/platform_test "$RUNNER_TEMP"
          build/kit_test
          build/map_preview_test "$RUNNER_TEMP/map_preview_test"

      # The renderer on Metal. GitHub's macOS machines may have no Metal device: a failure here does not stop the run.
      - name: Run the renderer on Metal
        continue-on-error: true
        run: build/render_smoke_test "$RUNNER_TEMP/render_smoke.png"

      # (GitHub's macOS machines have had a Metal device; if one has none, the snapshot fails and the run goes on)
      - name: Snapshot stardraft-next (Metal)
        continue-on-error: true
        run: |
          app=build/stardraft-next.app/Contents/MacOS/stardraft-next
          "$app" --snapshot next-macos-map.png
          "$app" --workspace triggers --type "한국어 입력 中文" --snapshot next-macos-triggers.png | tee next.txt
          grep -q "search field: 한국어 입력 中文" next.txt
          "$app" --workspace triggers --ime-inline --type "한국어 입" --compose "력" --snapshot next-macos-ime.png | tee ime.txt
          grep -q "composing: 력" ime.txt

      - name: Snapshot the kit demo (Metal)
        continue-on-error: true
        run: build/kit-demo.app/Contents/MacOS/kit-demo --snapshot kit-demo-macos.png

      # The app in a tar (an artifact keeps no file modes: the program would not start); and the snapshots.
      - name: Pack stardraft-next
        if: always()
        run: tar -C build -czf stardraft-next-macos.tar.gz stardraft-next.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stardraft-next-macos-${{ github.sha }}
          path: |
            next-macos-*.png
            kit-demo-macos.png
            stardraft-next-macos.tar.gz

      # The editor on SDL (stardraft, research/ports/MAC-BUILD-PLAN.md step 6): its shell with no map open, and the app.
      - name: Snapshot the editor (Metal)
        run: build/stardraft.app/Contents/MacOS/stardraft --snapshot editor-macos.png

      - name: Snapshot the editor (Assets workspace, Metal, no view yet)
        continue-on-error: true
        run: build/stardraft.app/Contents/MacOS/stardraft --workspace files --snapshot editor-macos-files.png

      # Each workspace and dialog (tools/sdl_snapshots.py), as on Linux (a failure stops the run: it has passed on GitHub's Metal).
      - name: Snapshot each workspace and dialog (Metal)
        run: python3 -I tools/sdl_snapshots.py --exe build/stardraft.app/Contents/MacOS/stardraft --out sdl-snapshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdl-snapshots-macos-${{ github.sha }}
          path: sdl-snapshots
          if-no-files-found: warn

      - name: Pack the editor
        if: always()
        run: tar -C build -czf stardraft-macos.tar.gz stardraft.app

      # The download for Mac users (tools/ci/mac_dist.sh): StarDraft.app in a disk image with a background and a link
      # to Applications. Signed with the Developer ID and notarized when the repository has the secrets (forks and pull
      # requests do not: then signed ad hoc, and the log says that signing was skipped). docs/dev/DEVELOPING.md tells how.
      - name: Make the disk image
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          case "$GITHUB_REF" in refs/tags/v*) name="StarDraft-${GITHUB_REF_NAME#v}-macos-arm64.dmg" ;; *) name="StarDraft-macos-arm64.dmg" ;; esac
          mkdir -p dist
          bash tools/ci/mac_dist.sh build/stardraft.app "dist/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: stardraft-dmg-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stardraft-editor-macos-${{ github.sha }}
          path: |
            editor-macos.png
            editor-macos-files.png
            stardraft-macos.tar.gz

  # A release tag: the macOS disk image goes on the release that the windows job made (it is made first: this job waits
  # for both). A run again leaves a release's disk image as it is, as the windows job leaves its zip.
  macos-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stardraft-dmg-${{ github.sha }}
          path: dist

      - name: Attach the disk image to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          dmg=$(ls dist/*.dmg | head -n 1)
          name=$(basename "$dmg")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF "$name"; then
            echo "The release $tag has $name: nothing changes."
            exit 0
          fi
          gh release upload "$tag" "$dmg" --repo "$GITHUB_REPOSITORY"

  # The tests with the game's data, on a self-hosted runner in WSL Ubuntu on the owner's PC (labels self-hosted, linux,
  # scdata; research/ports/PLAN.md 1.6). Off until the repository variable STARDRAFT_DATA_RUNNER is "on". The
  # repository is public: this job never runs for pull requests or forks, only for pushes here and by hand.
  # The install: $STARDRAFT_SC_INSTALL on the runner, else ~/scmirror (exact-case names, see linux_data_tests.sh).
  linux-data:
    if: vars.STARDRAFT_DATA_RUNNER == 'on' && github.event_name != 'pull_request' && github.repository == 'stardraft-editor/stardraft'
    runs-on: [self-hosted, linux, scdata]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_UNIX_CONSOLE_BUILD=ON  # (no X11 or Wayland needed)
          cmake --build build --parallel

      - name: Run the tests with game data
        env:
          SDL_VIDEODRIVER: offscreen
        run: bash tools/ci/linux_data_tests.sh build "${STARDRAFT_SC_INSTALL:-$HOME/scmirror}" "$RUNNER_TEMP/data-tests"

      # The editor's snapshots with the game data and a map open (tools/sdl_snapshots.py, from the step above).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdl-snapshots-linux-data-${{ github.sha }}
          path: ${{ runner.temp }}/data-tests/sdl_snapshots
          if-no-files-found: warn

  # The Windows build under Wine on Linux (research/ports/PLAN.md, phase 2): the renderer on Vulkan (Wine passes it to
  # the system's Vulkan, here lavapipe) and on Direct3D 12 (Wine's vkd3d makes it Vulkan). Only reports: Wine is a
  # stopgap for Linux users, not a release target.
  wine:
    needs: windows
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wine-test-${{ github.sha }}

      - name: Install Wine and Mesa's Vulkan drivers
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine mesa-vulkan-drivers xvfb

      - name: The renderer under Wine
        run: |
          export WINEDEBUG=-all
          xvfb-run -a wineboot -i  # (the Wine prefix)
          wine --version
          xvfb-run -a wine render_smoke_test.exe 2>&1 | tee wine-d3d12.txt || true
          STARDRAFT_GPU_DRIVER=vulkan xvfb-run -a wine render_smoke_test.exe 2>&1 | tee wine-vulkan.txt || true
          grep -q "0 failures" wine-vulkan.txt
