name: Post screenshots to Discord

# Run by hand (Actions > Post screenshots to Discord > Run workflow): the screenshots of a version's changelog section
# (docs/user/images/<version>/...), posted as files in each Discord channel that has a webhook, with the
# release's name and link. A release posts them itself (release.yml); this is for a post that did not go.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version, as in the changelog (for example 0.5.0.5)
        required: true
      channel:
        description: The channels to post in (the ones where the release's post did not go)
        type: choice
        options: [all, updates, general]
        default: all
      what:
        description: The release's link, the changelog and the screenshots, or only the screenshots
        type: choice
        options: [all, screenshots]
        default: all

jobs:
  post:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4  # main: tools/release.py, and the changelog with every version's section
      - name: Post
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_GENERAL_WEBHOOK: ${{ secrets.DISCORD_GENERAL_WEBHOOK }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
          WHAT: ${{ inputs.what }}
        run: |
          # As the release's own post: "**<release name>** is out: <link>", then each screenshot as a message of its own
          # with its text (tools/release.py discord).
          if ($env:WHAT -eq 'screenshots') {
            python -I tools/release.py discord $env:VERSION --channel $env:CHANNEL --screenshots-only
          } else {
            $url = gh release view "v$($env:VERSION)" --json url --jq .url
            if ($LASTEXITCODE -or -not $url) { throw "No release v$($env:VERSION)" }
            $title = gh release view "v$($env:VERSION)" --json name --jq .name
            python -I tools/release.py discord $env:VERSION --channel $env:CHANNEL --title "$title" --url "$url"
          }
          if ($LASTEXITCODE) { throw "The Discord post did not go" }
