name: Post screenshots to Discord

# Run by hand (Actions > Post screenshots to Discord > Run workflow): the screenshots of a version's changelog section
# (docs/user/images/<version>/...), posted as files in each Discord channel that has a webhook, with the
# release's name and link. A release posts them itself (build.yml); this is for a post that did not go.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version, as in the changelog (for example 0.5.0.5)
        required: true
      channel:
        description: The channels to post in (the ones where the release's post did not go)
        type: choice
        options: [all, updates, general]
        default: all

jobs:
  post:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4  # main: tools/release.py, and the changelog with every version's section
      - name: Post
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_GENERAL_WEBHOOK: ${{ secrets.DISCORD_GENERAL_WEBHOOK }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          $images = @(python -I tools/release.py notes $env:VERSION --images)
          if ($LASTEXITCODE) { throw "No section ## $($env:VERSION) in the changelog" }
          # (no pictures: the post has the text only)
          # The text as the release's own post has it: "**<release name>** is out: <link>".
          $url = gh release view "v$($env:VERSION)" --json url --jq .url
          if ($LASTEXITCODE -or -not $url) { throw "No release v$($env:VERSION)" }
          $title = gh release view "v$($env:VERSION)" --json name --jq .name
          @{ content = "**$title** is out: $url" } | ConvertTo-Json | Set-Content payload.json -Encoding utf8NoBOM
          $hooks = @()
          if ($env:CHANNEL -in 'all', 'updates') { $hooks += $env:DISCORD_RELEASE_WEBHOOK }
          if ($env:CHANNEL -in 'all', 'general') { $hooks += $env:DISCORD_GENERAL_WEBHOOK }
          $hooks = @($hooks | Where-Object { $_ })
          if (-not $hooks) { throw "No Discord webhook for $($env:CHANNEL) (DISCORD_RELEASE_WEBHOOK, DISCORD_GENERAL_WEBHOOK)" }
          foreach ($hook in $hooks) {
            $form = @('-sS', '--fail-with-body', '-F', 'payload_json=<payload.json')
            for ($i = 0; $i -lt $images.Count; $i++) { $form += @('-F', "files[$i]=@$($images[$i])") }
            curl.exe @form $hook
            if ($LASTEXITCODE -ne 0) { throw "The Discord post did not go ($LASTEXITCODE)" }
          }
