# The simulation's game rules: what it needs to know of StarCraft: Brood War beyond the game's data files.
# The engine reads units.dat, weapons.dat, flingy.dat, sprites.dat, images.dat and iscript.bin for everything they
# say; this file holds only what no data file says. A project can give its own copy as "sim/rules.ini".
# Each line: name = value (a number, or numbers separated by spaces; groups separated by commas); # starts a
# comment, and [sections] only group the lines.

[orders]  # orders.dat numbers of the game's own orders that units.dat gives some units (their code is the game's)
orderReaverAttack = 59   # its attack launches Scarabs (Reaver, Warbringer)
orderCarrierAttack = 53  # its attack launches Interceptors (Carrier, Gantrithor)
orderInterceptor = 64    # the Interceptor's own order
orderScarab = 65         # the Scarab's own order
orderMine = 20           # the Spider Mine's idle order
orderHeal = 175          # the Medic's attack: the heal

[units]  # units.dat numbers
scarabUnit = 85             # the unit a Reaver makes (fixed in the game's code)
interceptorUnit = 73        # the unit a Carrier makes
scarabsHeld = 5             # Scarabs a Reaver holds
interceptorsHeld = 4        # Interceptors a Carrier holds
attacksBurrowed = 103       # the Lurker: burrows at once, has its weapon only while burrowed, no turning
ordersEveryFrame = 37       # the Zergling: its order runs every frame while it can attack
startDelay = 68 17          # the Archon: its first order 17 frames after it is made (its merge)
gasImage = 7 403, 41 401, 64 399  # a worker and its image (images.dat) for carried gas

[orders and targets]
orderTick = 9               # an order runs every 9 frames
targetSearchFrames = 15     # attack move and guard: a look for targets every 15 frames
priorityNoAttackArmed = 2   # target priorities, 0 the best: a unit that cannot hit the attacker but can hit something
priorityWorker = 2          # a worker
priorityMover = 3           # a unit that can move
priorityBuilding = 4        # a building
priorityLow = 5             # larvae and eggs
sameWayTolerance = 32       # (direction steps) a target moving the same way: no moving margin
callForHelp = 96            # allies within 96 pixels of a hit unit take its attacker as their target

[attacks]
bounces = 3                 # a bouncing glaive's hits
bounceDivisor = 1 3 9       # its damage divisors
bounceSearch = 96           # its next target: within 96 pixels
launchWaitMax = 10          # a projectile with no launch signal flies after 10 frames
persistHitFrames = 7        # damage over time: a hit every 7 frames
lineHitRepeat = 32          # a line of hits hits each target once in 32 frames
# Damage factor (of 256) by damage type (independent, explosive, concussive, normal, ignore armor) and unit size
# (independent, small, medium, large).
damageFactor = 0 0 0 0, 0 128 192 256, 0 256 128 64, 256 256 256 256, 256 256 256 256
splashDivisor = 1 2 4       # splash damage divisors by ring: inner, medium, outer (air splash: at least the medium)
cooldownJitter = 4 -1       # a cooldown gets one of 4 values more, from -1 (a random draw)
minDamage = 128             # a hit that its armor stops still does half a point (8 fractional bits)
bulletTurnDivisor = 1       # a projectile's direction of travel turns by its full turn rate
bulletNear = 32             # a projectile within 32 pixels of its target that still turns:
bulletTurnMargin = 2 3 2    # it speeds up only with room to turn (turn frames 2 x diff / rate, x 3 / 2 pixels)
velocityTurnDivisor = 2     # flingy movement: the direction of travel turns by the turn rate / 2

[drawing]  # sprite elevation levels: the layers the map draws, the lower first (units: units.dat's level)
bulletElevationAbove = 1    # a projectile and its hit: one level above the unit that fired it
elevationLowest = 0         # lowsprul (remnants such as a corpse): the lowest level, under all
elevationHighest = 19       # highsprol: the highest level

[regeneration]  # 8 fractional bits a frame
regenHp = 4
regenShields = 7
regenEnergy = 8
maxEnergy = 200
startEnergy = 50            # a spellcaster's energy when it is made

[upgrades]  # upgrades.dat numbers: the map's start levels (PUPx, UPGR) count. upgrades.dat holds no effects.
# Speed (unit, upgrade): +1/2 top speed (at least 3 1/3 pixels a frame), double acceleration and turn rate.
# Ion Thrusters, Pneumatized Carapace, Metabolic Boost, Muscular Augments, Leg Enhancements, Gravitic Thrusters,
# Gravitic Drive, Gravitic Boosters, Anabolic Synthesis.
speedUpgrade = 2 17, 42 26, 37 27, 38 29, 65 34, 70 42, 69 37, 84 39, 39 53
speedAlways = 103           # the Lurker moves as if upgraded
speedUpgradeFactor = 3 2    # top speed x 3 / 2
speedUpgradeMin = 853       # (8 fractional bits)
speedUpgradeAccel = 2
speedUpgradeTurn = 2
# Range (unit, upgrade, pixels, 1: air weapon only): U-238 Shells, Grooved Spines, Singularity Charge, Charon Boosters.
rangeUpgrade = 0 16 32 0, 38 30 32 0, 66 33 64 0, 3 54 96 1
cooldownUpgrade = 37 28     # (unit, upgrade) Adrenal Glands: the Zergling's cooldown / 2
cooldownUpgradeDivisor = 2
armorUpgrade = 39 52 2      # (unit, upgrade, armor) Chitinous Plating: the Ultralisk +2
scarabsUpgrade = 36 10      # (upgrade, Scarabs) Reaver Capacity
interceptorsUpgrade = 43 8  # (upgrade, Interceptors) Carrier Capacity
shieldArmorUpgrade = 15     # Plasma Shields: shield armor + level
energyUpgrade = 51          # Caduceus Reactor: a healer's energy
maxEnergyUpgraded = 250
startEnergyUpgraded = 62    # (a quarter of 250)
projectileLimit = 103 80    # (weapon, projectiles) at most 80 Halo Rockets at once

[movement]
stuckRetry = 10             # the collision reaction: the block counter's limits
stuckRetryEnd = 20
stuckGiveUp = 30
stuckYield = 25
stuckHold = 50
stuckFresh = 2              # a blocker blocked at most 2 times: one waits for it
straightReach = 192         # a straight walk in a fight goes at most 192 pixels along its axis
pathAgeForRepath = 7        # a new path waits until the old one is 7 frames old
waypointPass = 16           # a braking unit passes a waypoint within 16 pixels when it can walk on straight

[medic]
healSearch = 160
healGap = 30
healMax = 200               # (8 fractional bits)
healEnergyDivisor = 2       # a heal costs half its amount in energy

[reaver and scarab]
scarabForward = 25          # a Scarab is let out 25 pixels ahead of its Reaver
scarabLock = 60             # the next Scarab 60 frames later
scarabStand = 5             # it moves from its 5th frame
scarabSpeed = 16            # pixels a frame
scarabArmFrames = 3         # it can explode from its 3rd frame
scarabBlastDelay = 4        # its blast lands 4 frames after it explodes
scarabLife = 90
scarabDetonate = 2          # it explodes within half its inner splash radius of its target

[carrier and interceptor]
interceptorLaunch = 7       # one Interceptor out every 7 frames
interceptorWait = 15        # a launched Interceptor waits 15 frames before it attacks
interceptorLeash = 64       # it returns beyond its Carrier's range + 64 pixels
interceptorNear = 50
interceptorDock = 10
interceptorLowShields = 4   # it returns with less than a quarter of its shields
interceptorSpread = 3 1 2   # its random points around the target: 3, 1, then 2 x a random -127..128
interceptorSpreadRange = 128
interceptorLaunchHp = 2     # one launches with at least half its hit points

[spider mine]
mineArm = 63
mineBurrow = 9
mineUnburrow = 18
mineFuse = 5
mineFuseStill = 9
mineChase = 576
mineFuseRange = 30
mineBlastDelay = 6

[mining]
miningFrames = 75           # a worker mines minerals 75 frames
gasFrames = 37              # and is inside a refinery 37 frames
miningReach = 10            # it mines within 10 pixels of the field
mineralLoad = 8             # minerals (and gas) carried in one trip
mineralImage = 397          # images.dat: the carried mineral chunk (+1: the small one)
mineralFull = 750           # a field's picture by its amount
mineralHalf = 500
mineralLow = 250
baseSearchTiles = 14
baseResourceGap = 96
fieldRange = 384
otherFieldRange = 256       # a worker whose field is in use looks for another within 256 pixels
clusterGap = 192
resourceNearBase = 640
depotNear = 64
frameMs = 42                # a game frame at Fastest
startMinerals = 50
gasWorkersMax = 3           # workers on gas in a mining run
